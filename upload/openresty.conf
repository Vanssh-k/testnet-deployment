worker_processes auto;
events {
  worker_connections 8192; 
  multi_accept on;
  use epoll;
}

http {
  resolver 8.8.8.8 valid=300s;
  include       mime.types;
  default_type  application/octet-stream;
  sendfile       on;
  keepalive_timeout  65;
  lua_package_path "/etc/nginx/lua/?.lua;;";

  # Define log format first
  log_format json_logs escape=json '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time"'
  '}';

  # Log to standard output
  access_log /dev/stdout json_logs;
  error_log /dev/stderr;

  # Rate limiting configuration
  limit_req_zone $binary_remote_addr zone=ip_limit:10m rate=5r/s;
  limit_req_status 429;

  # Optimized buffer settings for large uploads
  client_body_buffer_size 128k;
  client_max_body_size 16G;
  proxy_buffer_size 128k;
  proxy_buffers 32 128k;
  proxy_busy_buffers_size 256k;
  lua_socket_buffer_size 128k;
  lua_socket_pool_size 100;
  lua_socket_connect_timeout 120s;
  lua_socket_send_timeout 120s;
  lua_socket_read_timeout 120s;

  # Enable disk buffering for large requests/responses
  client_body_temp_path /tmp/nginx_client_temp 1 2;
  proxy_temp_path /tmp/nginx_proxy_temp 1 2;
  proxy_temp_file_write_size 128k;

  # Shared memory zone for authentication cache
  lua_shared_dict auth_cache 10m;
  lua_shared_dict http_conn_pool 10m;

  # Define upstream servers for load balancing
  upstream ipfs_nodes {
    server 127.0.0.1:5001;
    keepalive 32;
  }

  init_worker_by_lua_block {
    local lrucache = require "resty.lrucache"
    local ok, new_cache = pcall(lrucache.new, 100000)
    if not ok then
        error("failed to create cache: " .. (new_cache or "unknown error"))
    end
    ngx.shared.auth_cache:set("cache", new_cache)
  }

  server {
    listen 80;
    client_max_body_size 16G;
    proxy_buffering on;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    chunked_transfer_encoding on;

    location /health {
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    location /api/v0/dag/import {
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Apply rate limiting
        limit_req zone=ip_limit burst=10 nodelay;

        access_by_lua_block {
            local dag_handlers = require "dag_handlers"
            dag_handlers.authenticate()
        }
        
        proxy_pass http://ipfs_nodes;
        client_max_body_size 16G;
        proxy_buffering on;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "keep-alive";
        proxy_read_timeout 7200s;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        send_timeout 7200s;
        
        # Retry on upstream failure
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_timeout 5;
        proxy_next_upstream_tries 3;
        
        header_filter_by_lua_block {
            local dag_handlers = require "dag_handlers"
            dag_handlers.set_cors_headers()
        }
        
        body_filter_by_lua_block {
            local dag_handlers = require "dag_handlers"
            dag_handlers.process_dag_import_response()
        }
    }
    
    location /api/v0/add {
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Apply rate limiting
        limit_req zone=ip_limit burst=10 nodelay;

        access_by_lua_block {
            local api_handlers = require "api_handlers"
            api_handlers.authenticate()
        }
        
        proxy_pass http://ipfs_nodes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "keep-alive";
        proxy_read_timeout 7200s;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        send_timeout 7200s;

        # Retry on upstream failure
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_timeout 5;
        proxy_next_upstream_tries 3;

        header_filter_by_lua_block {
            local api_handlers = require "api_handlers"
            api_handlers.set_cors_headers()
        }

        body_filter_by_lua_block {
            local api_handlers = require "api_handlers"
            api_handlers.process_response()
        }
    }

    location / {
        return 404;
    }
  }
}
