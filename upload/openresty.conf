worker_processes auto;
events {
  worker_connections 8192; 
  multi_accept on;
  use epoll;
}

http {
  resolver 8.8.8.8 valid=300s;
  include       mime.types;
  default_type  application/octet-stream;
  sendfile       on;
  keepalive_timeout  65;
  lua_package_path "/etc/nginx/lua/?.lua;;";

  # Optimized buffer settings for large uploads
  client_body_buffer_size 128k;
  client_max_body_size 16G;
  proxy_buffer_size 128k;
  proxy_buffers 32 128k;
  proxy_busy_buffers_size 256k;
  lua_socket_buffer_size 128k;
  lua_socket_pool_size 100;
  lua_socket_connect_timeout 120s;
  lua_socket_send_timeout 120s;
  lua_socket_read_timeout 120s;

  # Enable disk buffering for large requests/responses
  client_body_temp_path /tmp/nginx_client_temp 1 2;
  proxy_temp_path /tmp/nginx_proxy_temp 1 2;
  proxy_temp_file_write_size 128k;

  log_format json_logs escape=json '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"http_referer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time"'
  '}';

  init_worker_by_lua_block {
    local lrucache = require "resty.lrucache"
    local ok, new_cache = pcall(lrucache.new, 100000)
    if not ok then
        error("failed to create cache: " .. (new_cache or "unknown error"))
    end
    ngx.shared.auth_cache:set("cache", new_cache)
  }

  server {
    listen 80;
    client_max_body_size 16G;
    proxy_buffering on;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    chunked_transfer_encoding on;

    location /health {
        return 200 "OK";
    }

    location /api/v0/add {
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "keep-alive";
        proxy_read_timeout 7200s;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        send_timeout 7200s;

        # Retry on upstream failure
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_timeout 5;
        proxy_next_upstream_tries 3;

        access_by_lua_block {
            local http = require "resty.http"
            local json = require "cjson.safe"
            local token = ngx.req.get_headers()["Authorization"]
            if not token or not token:match("^Bearer%s+(.+)$") then
                ngx.log(ngx.ERR, "Auth Failed: Missing or invalid token")
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say("Authentication token not found")
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end
            token = token:match("^Bearer%s+(.+)$")
            local httpc = http.new()
            local config = require "config"
            local auth_url = config.auth_url
            ngx.log(ngx.ERR, "Auth URL from config: " .. tostring(auth_url))
            auth_url = token:len() >= 204 and auth_url .. "verify_access_token" or auth_url .. "verify_api_key"
            local auth_res, auth_err = httpc:request_uri(auth_url, {
                method = "GET",
                headers = { Authorization = "Bearer " .. token},
                ssl_verify = false
            })
            if not auth_res then
                ngx.log(ngx.ERR, "Auth Failed: No response from API - " .. (auth_err or "unknown error"))
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say("Auth API unreachable")
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            elseif auth_res.status ~= 200 then
                ngx.log(ngx.ERR, "Auth Failed: API returned " .. auth_res.status .. " - Response: " .. auth_res.body)
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say("Auth Failed")
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end
            local auth_data = json.decode(auth_res.body)
            if not auth_data or not auth_data.publicKey then
                ngx.log(ngx.ERR, "Auth Failed: Invalid API response - " .. auth_res.body)
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say("Invalid Auth Response")
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end
            ngx.req.set_header("publicKey", auth_data.publicKey)
            if tonumber(auth_data.dataLimit) - tonumber(auth_data.dataUsed) <= 0 then
                ngx.log(ngx.ERR, "Auth Failed: Data limit exceeded for user " .. auth_data.publicKey)
                ngx.status = ngx.HTTP_FORBIDDEN
                ngx.say("Data limit exceeded")
                ngx.exit(ngx.HTTP_FORBIDDEN)
            end

            ngx.ctx.publicKey = auth_data.publicKey
            ngx.ctx.encryption = ngx.req.get_headers()["encryption"] and ngx.req.get_headers()["encryption"]:lower() == "true"

        }

        header_filter_by_lua_block {
            ngx.header["Access-Control-Allow-Origin"] = "*"
            ngx.header["Access-Control-Allow-Methods"] = "GET, POST, OPTIONS, PUT, DELETE"
            ngx.header["Access-Control-Allow-Headers"] = "Authorization, Content-Type, encryption, Accept, Origin, X-Requested-With, X-CSRF-Token, X-User-Key, x-deal-parameter"
            ngx.header["Access-Control-Allow-Credentials"] = "true"
            ngx.header["Content-Type"] = "application/json"
        }

        body_filter_by_lua_block {
            local json = require "cjson.safe"
            local chunk = ngx.arg[1]
            local eof = ngx.arg[2]

            if ngx.ctx.initialized ~= true then
                ngx.ctx.initialized = true
                ngx.ctx.line_count = 0
                ngx.ctx.max_lines = 100000  -- Safety limit

                if ngx.ctx.encryption then
                    ngx.ctx.json_objects = {}
                else
                    ngx.ctx.last_json_object = nil
                end
            end

            -- Process response chunks incrementally
            if chunk then
                for line in chunk:gmatch("[^\r\n]+") do
                    ngx.ctx.line_count = ngx.ctx.line_count + 1
                    if ngx.ctx.line_count > ngx.ctx.max_lines then
                        ngx.log(ngx.ERR, "Response too large, exceeded " .. ngx.ctx.max_lines .. " lines")
                        ngx.status = ngx.HTTP_REQUEST_ENTITY_TOO_LARGE
                        ngx.say("Response too large, too many files uploaded")
                        ngx.exit(ngx.HTTP_REQUEST_ENTITY_TOO_LARGE)
                    end
                    local json_object = line:match("(%b{})")
                    if json_object then
                        local decoded = json.decode(json_object)
                        if decoded then
                            if ngx.ctx.encryption then 
                                ngx.ctx.last_json_object = json_object
                                table.insert(ngx.ctx.json_objects, json_object)
                            else
                                ngx.ctx.last_json_object = json_object
                            end
                        else
                            ngx.log(ngx.ERR, "Invalid JSON in chunk: " .. line)
                        end
                    end
                end
            end

            -- Handle end of response
            if eof then
                local json_objects = ngx.ctx.last_json_object
                ngx.log(ngx.ERR, "[DEBUG] json_objects body: " .. json_objects)

                if (ngx.ctx.encryption and (not ngx.ctx.json_objects or #ngx.ctx.json_objects == 0)) or
                (not ngx.ctx.encryption and not ngx.ctx.last_json_object) then
                    ngx.log(ngx.ERR, "[BODY_FILTER] No valid JSON objects found in response! Encryption: ", tostring(ngx.ctx.encryption))
                    ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                    ngx.say("No valid JSON found in response")
                    ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
                end

                if ngx.ctx.encryption then
                    local final_json_array = "[" .. table.concat(ngx.ctx.json_objects, ",") .. "]"
                    ngx.ctx.record_data = final_json_array
                    local utils = require("utils")
                    local ok, err = ngx.timer.at(0, utils.create_record_encrypted, ngx.var.uri, ngx.ctx.record_data, ngx.ctx.publicKey)
                    if not ok then
                        ngx.log(ngx.ERR, "Failed to create timer for encrypted record: " .. (err or "unknown error"))
                    end
                    ngx.arg[1] = final_json_array
                    ngx.arg[2] = true
                    return
                end

                -- Normal unencrypted uploads
                ngx.ctx.record_data = ngx.ctx.last_json_object
                local utils = require("utils")
                local ok, err = ngx.timer.at(0, utils.create_record_normal, ngx.var.uri, ngx.ctx.record_data, ngx.ctx.publicKey)
                if not ok then
                    ngx.log(ngx.ERR, "Failed to create timer: " .. (err or "unknown error"))
                end
                ngx.arg[1] = ngx.ctx.last_json_object
                ngx.arg[2] = true
            else
                ngx.arg[1] = nil  -- Clear chunk to prevent sending partial data
            end
        }
    }

    location /api/v0/dag/import {

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 7200s;
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;

        access_by_lua_block {
            local http = require "resty.http"
            local json = require "cjson.safe"
            -- Handle Auth
            local token = ngx.req.get_headers()["Authorization"]
            if not token or not token:match("^Bearer%s+(.+)$") then
                ngx.log(ngx.ERR, "Auth Failed: Missing or invalid token")
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say("Authentication token not found")
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end
            token = token:match("^Bearer%s+(.+)$")
            -- Call authentication API
            local httpc = http.new()
            local config = require "config"
            local auth_url = config.auth_url
            ngx.log(ngx.ERR, "Auth URL from config: " .. tostring(auth_url))
            auth_url = token:len() >= 204 and auth_url .. "verify_access_token" or auth_url .. "verify_api_key"
            local auth_res, auth_err = httpc:request_uri(auth_url, {
                method = "GET",
                headers = { Authorization = "Bearer " .. token},
                ssl_verify = false
            })
            if not auth_res then
                ngx.log(ngx.ERR, "Auth Failed: No response from API - " .. (auth_err or "unknown error"))
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say("Auth API unreachable")
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            elseif auth_res.status ~= 200 then
                ngx.log(ngx.ERR, "Auth Failed: API returned " .. auth_res.status .. " - Response: " .. auth_res.body)
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say("Auth Failed")
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end
            local auth_data = json.decode(auth_res.body)
            if not auth_data or not auth_data.publicKey then
                ngx.log(ngx.ERR, "Auth Failed: Invalid API response - " .. auth_res.body)
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say("Invalid Auth Response")
                ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end
            ngx.req.set_header("publicKey", auth_data.publicKey)
            if tonumber(auth_data.dataLimit) - tonumber(auth_data.dataUsed) <= 0 then
                ngx.log(ngx.ERR, "Auth Failed: Data limit exceeded for user " .. auth_data.publicKey)
                ngx.status = ngx.HTTP_FORBIDDEN
                ngx.say("Data limit exceeded")
                ngx.exit(ngx.HTTP_FORBIDDEN)
            end
        }
        header_filter_by_lua_block {
            ngx.header["Access-Control-Allow-Origin"] = "*"
            ngx.header["Access-Control-Allow-Methods"] = "GET, POST, OPTIONS, PUT, DELETE"
            ngx.header["Access-Control-Allow-Headers"] = "Authorization, Content-Type, encryption, Accept, Origin, X-Requested-With, X-CSRF-Token, X-User-Key"
            ngx.header["Access-Control-Allow-Credentials"] = "true"
            ngx.header["Content-Type"] = "application/json"
        }
        body_filter_by_lua_block {
            local json = require "cjson.safe"

            local chunk = ngx.arg[1]
            local eof = ngx.arg[2]

            -- Accumulate chunks in ctx
            if not ngx.ctx.body then
                ngx.ctx.body = {}
            end
            if chunk then
                table.insert(ngx.ctx.body, chunk)
            end

            if eof then
                local utils = require("utils")
                local response_body = table.concat(ngx.ctx.body)
                ngx.log(ngx.ERR, "Full response body: " .. response_body)

                -- Set headers
                local headers = ngx.req.get_headers()
                ngx.ctx.publicKey = headers["publicKey"]
                ngx.ctx.encryption = headers["encryption"] and headers["encryption"]:lower() == "true"

                -- Decode response once
                local body_table = json.decode(response_body)

                -- CASE: CAR file
                if body_table and body_table.Root and body_table.Root.Cid then
                    local utils = require("utils")
                    local cid = body_table.Root.Cid["/"]
                    local filename = ngx.var.arg_filename or "carfile.car"
                    local uri = ngx.var.uri
                    local publicKey = ngx.ctx.publicKey

                    local function fetch_and_record(_, uri, cid, filename, publicKey)
                        local http = require "resty.http"
                        local json = require "cjson.safe"
                        local httpc = http.new()

                        local res, err = httpc:request_uri("http://127.0.0.1:5001/api/v0/dag/stat?arg=" .. cid, {
                            method = "POST"
                        })

                        if not res or res.status ~= 200 then
                            ngx.log(ngx.ERR, "Failed to fetch dag stat for CAR: " .. (err or (res and res.body) or "unknown"))
                            return
                        end

                        local stat_data
                        for obj in res.body:gmatch("(%b{})") do
                            stat_data = json.decode(obj)
                        end

                        if not stat_data then
                            ngx.log(ngx.ERR, "Failed to decode stat_data: " .. (res.body or "empty body"))
                            return
                        end

                        local transformed = {
                            Name = filename,
                            Hash = cid,
                            Size = tostring(stat_data.TotalSize or stat_data.Size or 0)
                        }

                        local json = require "cjson.safe"
                        local transformed_json = json.encode(transformed)

                        -- Finally, offload record creation
                        local ok, err = ngx.timer.at(0, utils.create_record_normal, uri, transformed_json, publicKey, false)
                        if not ok then
                            ngx.log(ngx.ERR, "Failed to create record with timer: " .. (err or "unknown error"))
                        end
                    end

                    -- Kick off the async DAG stat + record flow
                    local ok, err = ngx.timer.at(0, fetch_and_record, uri, cid, filename, publicKey)
                    if not ok then
                        ngx.log(ngx.ERR, "Failed to start fetch_and_record timer: " .. (err or "unknown error"))
                    end
                    return
                end

            end
        }
    }
  }
}