version: "3"

name: upload-service

services:
  upload:
    build:
      context: .
      args:
        - AWS_SECRET_KEY=${AWS_SECRET_KEY}
        - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
        - AWS_REGION=${AWS_REGION}
        - AWS_S3_BUCKET=${AWS_S3_BUCKET}
        - AUTH_URL=${AUTH_URL}
        - LAMBDA_URL=${LAMBDA_URL}
        - AUTH_TOKEN=${AUTH_TOKEN}
    ports:
      - "8080:80"
    environment:
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AUTH_URL=${AUTH_URL}
      - LAMBDA_URL=${LAMBDA_URL}
      - AUTH_TOKEN=${AUTH_TOKEN}
    volumes:
      - ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ipfs_data:
