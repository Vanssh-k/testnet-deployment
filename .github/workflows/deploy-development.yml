name: Deploy to Development

on:
  push:
    branches: 
      - development
  pull_request:
    branches: 
      - development
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: 'upload'
        type: choice
        options:
          - upload
          - all

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      upload-changed: ${{ steps.changes.outputs.upload }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            upload:
              - 'upload/**'

  deploy-upload:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.upload-changed == 'true' || 
      github.event_name == 'workflow_dispatch' && 
      (github.event.inputs.service == 'upload' || github.event.inputs.service == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key

      - name: Deploy upload service to Ubuntu instance
        run: |
          # Create deployment script
          cat > deploy-upload.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "Starting upload service deployment..."
          
          # Fix Docker permissions
          sudo usermod -aG docker ubuntu || true
          sudo systemctl start docker || true
          sudo systemctl enable docker || true
          
          # Navigate to application directory
          cd deployment
          
          # Complete Docker cleanup
          echo "Performing complete Docker cleanup..."
          sudo docker-compose -p upload-service down --remove-orphans --volumes || true
          sudo docker system prune -af
          sudo docker volume prune -f
          sudo docker container prune -f
          sudo docker image prune -af
          
          # Remove any remaining containers and images
          sudo docker container ls -aq | xargs -r sudo docker container rm -f
          sudo docker image ls -aq | xargs -r sudo docker image rm -f
          
          # Clone or pull the repository
          echo "Current directory: $(pwd)"
          echo "Git directory exists: $([ -d ".git" ] && echo "YES" || echo "NO")"
          if [ ! -d ".git" ]; then
            echo "Cloning repository..."
            git clone https://x-access-token:${{ secrets.TOKEN_GITHUB_DEPLOY }}@github.com/Vanssh-k/testnet-deployment.git .
          else
            echo "Pulling latest changes..."
            # Configure git to use token for all operations
            git remote set-url origin https://x-access-token:${{ secrets.TOKEN_GITHUB_DEPLOY }}@github.com/Vanssh-k/testnet-deployment.git
            git fetch origin
            git reset --hard origin/development
          fi
          
          # Copy upload service files to current directory
          cd upload
          
          # Export environment variables for docker-compose BEFORE building
          export AWS_SECRET_KEY=$AWS_SECRET_KEY
          export AWS_ACCESS_KEY=$AWS_ACCESS_KEY
          export AWS_REGION=$AWS_REGION
          export AWS_S3_BUCKET=$AWS_S3_BUCKET
          export AUTH_URL=$AUTH_URL
          export LAMBDA_URL=$LAMBDA_URL
          export AUTH_TOKEN=$AUTH_TOKEN

          # Verify environment variables are available
          echo "Checking environment variables..."
          echo "AWS_SECRET_KEY:" $AWS_SECRET_KEY
          echo "AWS_ACCESS_KEY:" $AWS_ACCESS_KEY
          echo "AWS_REGION:" $AWS_REGION
          echo "AWS_S3_BUCKET:" $AWS_S3_BUCKET
          echo "AUTH_URL:" $AUTH_URL
          echo "LAMBDA_URL:" $LAMBDA_URL
          echo "AUTH_TOKEN:" $AUTH_TOKEN

          # Start services using docker-compose with project name and force recreation
          sudo --preserve-env docker-compose -p upload-service build --no-cache
          
          sudo --preserve-env docker-compose -p upload-service up -d --force-recreate --remove-orphans
          
          echo "Upload service deployment completed successfully!"
          EOF
          
          # Create directory on server first
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "sudo mkdir -p deployment && sudo chown ubuntu:ubuntu deployment"
          
          # Copy deployment script to server
          scp -o StrictHostKeyChecking=no -i private_key deploy-upload.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/
          
          # Execute deployment on server using the SSH key file
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'SSHEOF'
            # Make deployment script executable and run
            chmod +x /tmp/deploy-upload.sh
            
            # Export environment variables for the deployment
            export AWS_SECRET_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_REGION=${{ secrets.AWS_REGION }}
            export AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            export AUTH_URL=${{ secrets.AUTH_URL }}
            export LAMBDA_URL=${{ secrets.LAMBDA_URL }}
            export AUTH_TOKEN=${{ secrets.AUTH_TOKEN }}
            
            # Pass environment variables to the deployment script
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            AUTH_URL=${{ secrets.AUTH_URL }}
            LAMBDA_URL=${{ secrets.LAMBDA_URL }}
            AUTH_TOKEN=${{ secrets.AUTH_TOKEN }}
            /tmp/deploy-upload.sh
          SSHEOF

      - name: Upload service health check
        run: |
          sleep 30
          
          # Check Docker containers status
          echo "Checking upload service Docker containers status..."
          ssh -o StrictHostKeyChecking=no -i private_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DOCKER_CHECK'
            cd upload
            
            # Check if our docker-compose containers are running using docker commands
            echo "Checking upload service containers using docker commands..."
            
            # Get containers for our project
            project_containers=$(sudo docker ps --filter "label=com.docker.compose.project=upload-service" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}")
            
            if [ -z "$project_containers" ]; then
              echo "ERROR: No upload service containers found!"
              echo "All running containers:"
              sudo docker ps
              exit 1
            fi
            
            echo "Upload service containers:"
            echo "$project_containers"
            
            # Check for any containers that are not running
            non_running_containers=$(sudo docker ps --filter "label=com.docker.compose.project=upload-service" --filter "status=exited" --filter "status=dead" --format "{{.Names}}")
            
            if [ -n "$non_running_containers" ]; then
              echo "ERROR: Some upload service containers are not running!"
              echo "Non-running containers: $non_running_containers"
              sudo docker ps -a --filter "label=com.docker.compose.project=upload-service"
              exit 1
            fi
            
            # Check for unhealthy containers
            unhealthy_containers=$(sudo docker ps --filter "label=com.docker.compose.project=upload-service" --filter "health=unhealthy" --format "{{.Names}}")
            
            if [ -n "$unhealthy_containers" ]; then
              echo "ERROR: Some upload service containers are unhealthy!"
              echo "Unhealthy containers: $unhealthy_containers"
              sudo docker logs --tail=50 $unhealthy_containers
              exit 1
            fi
            
            # Verify all expected services are running
            echo "Verifying all expected services are running..."
            expected_services=$(sudo docker-compose -p upload-service config --services)
            running_containers=$(sudo docker ps --filter "label=com.docker.compose.project=upload-service" --format "{{.Names}}")
            
            echo "Expected services: $expected_services"
            echo "Running containers: $running_containers"
            
            # Check if all expected services have running containers
            for service in $expected_services; do
              if ! echo "$running_containers" | grep -q "upload-service_${service}_"; then
                echo "ERROR: Service '$service' is not running!"
                exit 1
              fi
            done
            
            echo "All upload service Docker containers are running and healthy!"
          DOCKER_CHECK
          
          # Check upload service health endpoint
          echo "Checking upload service health endpoint..."
          curl -f http://${{ secrets.SSH_HOST }}:8080/health || exit 1