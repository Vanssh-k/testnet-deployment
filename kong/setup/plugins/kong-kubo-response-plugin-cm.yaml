apiVersion: v1
data:
  handler.lua: |
    local http = require "resty.http"
    local cjson = require "cjson.safe"
    local ngx = ngx

    local KuboResponseHandler = {
      VERSION = "1.0.0",
      PRIORITY = 1000
    }

    local function schedule_async_call_for_entry(premature, conf, payload)
      if premature then
        kong.log.debug("Timer prematurely terminated")
        return
      end

      kong.log.debug("Starting async API call with payload: ", cjson.encode(payload))
      local httpc = http.new()

      local res, err = httpc:request_uri(conf.endpoint, {
        method = "POST",
        body = cjson.encode(payload),
        headers = {
          ["Content-Type"] = "application/json",
          ["Authorization"] = "Bearer " .. conf.endpoint_validation_token,
        },
        keepalive_timeout = conf.timeout,
        keepalive_pool = 10,
      })

      if not res then
        kong.log.err("Failed to make request to API: ", err)
      else
        kong.log.debug("API call returned status: ", res.status)
      end
    end

    local function handle_response_entry(conf, response_entry, public_key, encryption)
      local name = response_entry.Name
      local hash = response_entry.Hash
      local size = tonumber(response_entry.Size)

      if not name or not hash or not size then
        kong.log.err("Missing or invalid values in response entry: name=", name, " hash=", hash, " size=", response_entry.Size)
        return
      end

      local payload = {
        name = name,
        size = size,
        cid = hash,
        publicKey = public_key,
        mimeType = "unknown",
        encryption = encryption
      }

      local ok, err = ngx.timer.at(0, schedule_async_call_for_entry, conf, payload)
      if not ok then
        kong.log.err("Failed to schedule async API call: ", err)
      else
        kong.log.debug("Async API call scheduled for response entry")
      end
    end

    local function handle_all_response_entries(conf, full_response_body, public_key, encryption)
      for line in full_response_body:gmatch("[^\r\n]+") do
        local response_entry, err = cjson.decode(line)
        if response_entry then
          handle_response_entry(conf, response_entry, public_key, encryption)
        else
          kong.log.err("Failed to decode response entry: ", err)
        end
      end
    end

    local function get_last_response_body(full_response_body)
      kong.log.debug("Processing full response body: ", full_response_body)

      local responses = {}
      for line in full_response_body:gmatch("[^\r\n]+") do
        table.insert(responses, line)
      end

      if kong.request.get_method() ~= "POST" then
        kong.log.warn("Request method is not POST, skipping response processing")
        return nil, "Request method is not POST"
      end

      if #responses == 0 then
        kong.log.err("No responses found in the full response body")
        return nil, "Empty response body"
      end

      local last_response = responses[#responses]
      kong.log.debug("Last response extracted: ", last_response)

      local last_body, err = cjson.decode(last_response)
      if not last_body then
        kong.log.err("Failed to decode the last response: ", err, " - Last response body: ", last_response)
        return nil, err
      end

      return last_body
    end

    function KuboResponseHandler:body_filter(conf)
      local ctx = kong.ctx.plugin
      local chunk = kong.response.get_raw_body()
      local eof = ngx.arg[2]

      if not ctx.buffer then
        kong.log.debug("Initializing response buffer")
        ctx.buffer = {}
      end

      if chunk then
        table.insert(ctx.buffer, chunk)
        kong.log.debug("Added chunk to response buffer")
      end

      if not eof then
        kong.log.debug("Waiting for full response")
        ngx.arg[1] = nil
        return
      end

      local full_response_body = table.concat(ctx.buffer)
      -- kong.log.debug("Full response body received: ", full_response_body)

      local public_key = kong.response.get_header(conf.user_identifier)
      if not public_key then
        kong.log.err("Missing ", conf.user_identifier, " header in the response")
        kong.response.exit(400, cjson.encode({ message = "Public key not found. Please reupload." }))
        return
      else
        kong.log.debug("Public key found: ", public_key)
      end

      local encryption = kong.request.get_header("Encryption") ~= nil
      if encryption then
        kong.log.debug("Encryption header detected; handling encrypted entries")
        handle_all_response_entries(conf, full_response_body, public_key, encryption)
        kong.response.set_raw_body(full_response_body)
      else
        local last_body, err = get_last_response_body(full_response_body)
        if not last_body then
          kong.log.err("Error in extracting last response body; returning original response: ", err)
          kong.response.set_raw_body(full_response_body)
          return
        end
        kong.log.debug("No encryption header; handling non-encrypted entry")
        handle_response_entry(conf, last_body, public_key, encryption)
        kong.response.set_raw_body(cjson.encode(last_body))
      end
    end

    return KuboResponseHandler
  schema.lua: |-
    local typedefs = require "kong.db.schema.typedefs"


    local PLUGIN_NAME = "kubo-response"

    -- The schema for the plugin
    local schema = {
      name = PLUGIN_NAME,
      fields = {
        { protocols = typedefs.protocols_http },
        { consumer = typedefs.no_consumer },
        { config = {
            type = "record",
            fields = {
                { endpoint = typedefs.url({ required = true }) },
                { user_identifier = typedefs.header_name{ default = "X-User-Key", required = true } },
                { endpoint_validation_token = { type = "string", required = true } },
                { timeout = { type = "number", default = 60000 } },
            },
            },
        },
    }
    }
    return schema
kind: ConfigMap
metadata:
  creationTimestamp: null
