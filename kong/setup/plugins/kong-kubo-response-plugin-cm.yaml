apiVersion: v1
data:
  handler.lua: "local http = require \"resty.http\"\nlocal cjson = require \"cjson.safe\"\nlocal
    ngx = ngx\n\nlocal KuboResponseHandler = {\n  VERSION = \"1.0.0\",\n  PRIORITY
    = 1000\n}\n\nlocal function schedule_async_call_for_entry(premature, conf, payload)\n
    \ if premature then\n    kong.log.debug(\"Timer prematurely terminated\")\n    return\n
    \ end\n\n  kong.log.debug(\"Starting async API call with payload: \", cjson.encode(payload))\n
    \ local httpc = http.new()\n\n  local res, err = httpc:request_uri(conf.endpoint,
    {\n    method = \"POST\",\n    body = cjson.encode(payload),\n    headers = {\n
    \     [\"Content-Type\"] = \"application/json\",\n      [\"Authorization\"] =
    \"Bearer \" .. conf.endpoint_validation_token,\n    },\n    keepalive_timeout
    = conf.timeout,\n    keepalive_pool = 10,\n  })\n\n  if not res then\n    kong.log.err(\"Failed
    to make request to API: \", err)\n  else\n    kong.log.debug(\"API call returned
    status: \", res.status)\n  end\nend\n\nlocal function handle_response_entry(conf,
    response_entry, public_key, encryption)\n  local name = response_entry.Name\n
    \ local hash = response_entry.Hash\n  local size = tonumber(response_entry.Size)\n\n
    \ if not name or not hash or not size then\n    kong.log.err(\"Missing or invalid
    values in response entry: name=\", name, \" hash=\", hash, \" size=\", response_entry.Size)\n
    \   return\n  end\n\n  local payload = {\n    name = name,\n    size = size,\n
    \   cid = hash,\n    publicKey = public_key,\n    mimeType = \"unknown\",\n    encryption
    = encryption\n  }\n\n  local ok, err = ngx.timer.at(0, schedule_async_call_for_entry,
    conf, payload)\n  if not ok then\n    kong.log.err(\"Failed to schedule async
    API call: \", err)\n  else\n    kong.log.debug(\"Async API call scheduled for
    response entry\")\n  end\nend\n\nlocal function handle_all_response_entries(conf,
    full_response_body, public_key, encryption)\n  for line in full_response_body:gmatch(\"[^\\r\\n]+\")
    do\n    local response_entry, err = cjson.decode(line)\n    if response_entry
    then\n      handle_response_entry(conf, response_entry, public_key, encryption)\n
    \   else\n      kong.log.err(\"Failed to decode response entry: \", err)\n    end\n
    \ end\nend\n\nlocal function get_last_response_body(full_response_body)\n  kong.log.debug(\"Processing
    full response body: \", full_response_body)\n\n  local responses = {}\n  for line
    in full_response_body:gmatch(\"[^\\r\\n]+\") do\n    table.insert(responses, line)\n
    \ end\n\n  if kong.request.get_method() ~= \"POST\" then\n    kong.log.warn(\"Request
    method is not POST, skipping response processing\")\n    return nil, \"Request
    method is not POST\"\n  end\n\n  if #responses == 0 then\n    kong.log.err(\"No
    responses found in the full response body\")\n    return nil, \"Empty response
    body\"\n  end\n\n  local last_response = responses[#responses]\n  kong.log.debug(\"Last
    response extracted: \", last_response)\n\n  local last_body, err = cjson.decode(last_response)\n
    \ if not last_body then\n    kong.log.err(\"Failed to decode the last response:
    \", err, \" - Last response body: \", last_response)\n    return nil, err\n  end\n\n
    \ return last_body\nend\n\nfunction KuboResponseHandler:body_filter(conf)\n  local
    ctx = kong.ctx.plugin\n  local chunk = kong.response.get_raw_body()\n  local eof
    = ngx.arg[2]\n\n  local method = kong.request.get_method()\n  if method ~= \"POST\"
    then\n    kong.log.debug(\"Request method is not POST; returning the original
    response without preprocessing\")\n    ngx.arg[1] = chunk\n    return\n  end\n\n
    \ local status = kong.response.get_status()\n  if status == 401 or status == 500
    then\n    kong.log.debug(\"Response status is \", status, \", returning the original
    response\")\n    ngx.arg[1] = chunk\n    return\n  end\n\n  if not ctx.buffer
    then\n    kong.log.debug(\"Initializing response buffer\")\n    ctx.buffer = {}\n
    \ end\n\n  if chunk then\n    table.insert(ctx.buffer, chunk)\n    kong.log.debug(\"Added
    chunk to response buffer\")\n  end\n\n  if not eof then\n    kong.log.debug(\"Waiting
    for full response\")\n    ngx.arg[1] = nil\n    return\n  end\n\n  local full_response_body
    = table.concat(ctx.buffer)\n  -- kong.log.debug(\"Full response body received:
    \", full_response_body)\n\n  local public_key = kong.response.get_header(conf.user_identifier)\n
    \ if not public_key and kong.method == OPTIONS then\n    kong.log.err(\"Missing
    \", conf.user_identifier, \" header in the response\")\n    \n    return\n  else\n
    \   kong.log.debug(\"Public key found: \", public_key)\n  end\n\n  local encryption
    = kong.request.get_header(\"Encryption\") ~= nil\n  if encryption then\n    kong.log.debug(\"Encryption
    header detected; handling encrypted entries\")\n    handle_all_response_entries(conf,
    full_response_body, public_key, encryption)\n    kong.response.set_raw_body(full_response_body)\n
    \ else\n    local last_body, err = get_last_response_body(full_response_body)\n
    \   if not last_body then\n      kong.log.err(\"Error in extracting last response
    body; returning original response: \", err)\n      kong.response.set_raw_body(full_response_body)\n
    \     return\n    end\n    kong.log.debug(\"No encryption header; handling non-encrypted
    entry\")\n    handle_response_entry(conf, last_body, public_key, encryption)\n
    \   kong.response.set_raw_body(cjson.encode(last_body))\n  end\nend\n\nreturn
    KuboResponseHandler\n"
  schema.lua: |-
    local typedefs = require "kong.db.schema.typedefs"


    local PLUGIN_NAME = "kubo-response"

    -- The schema for the plugin
    local schema = {
      name = PLUGIN_NAME,
      fields = {
        { protocols = typedefs.protocols_http },
        { consumer = typedefs.no_consumer },
        { config = {
            type = "record",
            fields = {
                { endpoint = typedefs.url({ required = true }) },
                { user_identifier = typedefs.header_name{ default = "X-User-Key", required = true } },
                { endpoint_validation_token = { type = "string", required = true } },
                { timeout = { type = "number", default = 60000 } },
            },
            },
        },
    }
    }
    return schema
kind: ConfigMap
