apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: '*'
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: 'arn:aws:acm:ap-south-1:661238243294:certificate/41d0bdfc-8f7f-4259-a4ea-6c45d56b132e'
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: '443, 8443'
    service.beta.kubernetes.io/aws-load-balancer-ssl-negotiation-policy: ELBSecurityPolicy-2016-08
  labels:
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: kong
    app.kubernetes.io/name: gateway
  name: kong-gateway-proxy
  namespace: kong
spec:
  ports:
  - name: kong-proxy
    port: 443
    protocol: TCP
    targetPort: 8000
  - name: kong-proxy-tls
    port: 8443
    protocol: TCP
    targetPort: 8443
  - name: metrics
    port: 8100
    protocol: TCP
    targetPort: 8100
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: kong
    app.kubernetes.io/name: gateway
  type: LoadBalancer
