apiVersion: v1
data:
  handler.lua: |-
    local http = require "resty.http"
    local cjson = require "cjson.safe"
    local ngx = ngx

    local KuboResponseHandler = {
      VERSION = "1.0.0",
      PRIORITY = 1000
    }

    local function async_api_call(premature, conf, name, size, hash, public_key)
      if premature then
        kong.log.info("Timer prematurely terminated")
        return
      end

      kong.log.info("Starting async API call")
      local httpc = http.new()

      local payload = {
        name = name,
        size = size,
        cid = hash,
        publicKey = public_key,
        mimeType = "unknown",
        encryption = false,
      }

      local payload_json = cjson.encode(payload)
      kong.log.info("Payload for async API call: ", payload_json)

      local res, err = httpc:request_uri(conf.endpoint, {
        method = "POST",
        body = payload_json,
        headers = {
          ["Content-Type"] = "application/json",
          ["Authorization"] = "Bearer " .. conf.endpoint_validation_token,
        },
        keepalive_timeout = conf.timeout,
        keepalive_pool = 10,
      })

      if not res then
        kong.log.err("Failed to make request to constant API: ", err)
      else
        kong.log.info("API call to constant API returned status: ", res.status)
      end
    end

    local function get_last_response_body(full_response_body)
      kong.log.info("Processing full response body: ", full_response_body)  -- Log the entire body

      local responses = {}
      for line in full_response_body:gmatch("[^\r\n]+") do
        table.insert(responses, line)
      end

      if kong.request.get_method() ~= "POST" then
        kong.log.warn("Request method is not POST, skipping response processing")  -- Log non-POST methods
        return
      end

      if #responses == 0 then
        kong.log.err("No responses found in the full response body")
        return nil, "Empty response body"
      end

      local last_response = responses[#responses]
      kong.log.info("Last response extracted: ", last_response)  -- Log the last response

      local last_body, err = cjson.decode(last_response)
      if not last_body then
        kong.log.err("Failed to decode the last response: ", err, " - Last response body: ", last_response)
        return nil, err
      end

      return last_body
    end

    function KuboResponseHandler:body_filter(conf)
      local ctx = kong.ctx.plugin

      local chunk = kong.response.get_raw_body()
      local eof = ngx.arg[2]  -- Use ngx for eof as kong.response does not provide this

      if not ctx.buffer then
        kong.log.info("Initializing response buffer")
        ctx.buffer = {}
      end

      if chunk then
        kong.log.info("Received response chunk: ", chunk)
        table.insert(ctx.buffer, chunk)
      end

      if not eof then
        kong.log.info("Response not complete yet")
        ngx.arg[1] = nil
        return
      end

      if eof then
        -- Complete response received, process it
        local full_response_body = table.concat(ctx.buffer)
        kong.log.info("Full response body received: ", full_response_body)

        -- Attempt to get the last response body
        local last_body, err = get_last_response_body(full_response_body)
        if not last_body then
          -- Error handling: return the original body if we fail to extract the last response
          kong.log.err("Failed to extract the last response body, returning original response")
          kong.response.set_raw_body(full_response_body)
          return
        end

        -- Extract relevant fields from the last response
        local name = last_body.Name
        local hash = last_body.Hash
        local size = tonumber(last_body.Size)

        if not name or not hash or not size then
          -- Error handling: log and return original body if any value is nil
          kong.log.err("Missing or invalid values in the last response: name=", name, " hash=", hash, " size=", last_body.Size)
          kong.response.set_raw_body(full_response_body)
          return
        end

        -- Extract public key from headers
        local public_key = kong.response.get_header(conf.user_identifier)
        if not public_key then
          -- Error handling: send error response if public_key is missing
          kong.log.err("Missing ", conf.user_identifier, " header in the response")

          -- Set an error response to prompt the user to reupload the file
          kong.response.set_status(400)  -- HTTP 400 Bad Request
          kong.response.set_header("Content-Type", "application/json")
          kong.response.exit(400, cjson.encode({
            message = "Public key not found in the response. Please reupload the file."
          }))

          -- Stop further processing
          return
        else
          kong.log.info("Extracted public key: ", public_key)
        end

        -- Schedule an asynchronous API call
        local ok, err = ngx.timer.at(0, async_api_call, conf, name, size, hash, public_key)
        if not ok then
          kong.log.err("Failed to create timer for async API call: ", err)
        else
          kong.log.info("Successfully scheduled async API call")
        end

        -- Send the last response body back to the client
        kong.response.set_raw_body(cjson.encode(last_body))  -- Return last response body
      end
    end

    return KuboResponseHandler
  schema.lua: |-
    local typedefs = require "kong.db.schema.typedefs"


    local PLUGIN_NAME = "kubo-response"

    -- The schema for the plugin
    local schema = {
      name = PLUGIN_NAME,
      fields = {
        { protocols = typedefs.protocols_http },
        { consumer = typedefs.no_consumer },
        { config = {
            type = "record",
            fields = {
                { endpoint = typedefs.url({ required = true }) },
                { user_identifier = typedefs.header_name{ default = "X-User-Key", required = true } },
                { endpoint_validation_token = { type = "string", required = true } },
                { timeout = { type = "number", default = 60000 } },
            },
            },
        },
    }
    }
    return schema
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: kong-kubo-response-plugin-cm
  namespace: kong
