apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lighthouse-backend-ingress
  namespace: prod
  labels:
    app: lighthouse-backend
  annotations:
    konghq.com/protocol: http
    konghq.com/strip-path: "true"
spec:
  ingressClassName: kong
  rules:
    - host: backend.lighthouse.storage
      http:
        paths:
          - path: /api/v0/
            pathType: ImplementationSpecific
            backend:
              service:
                name: lighthouse-backend-service
                port:
                  number: 3000