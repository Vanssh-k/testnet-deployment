stream {
    limit_conn_zone $binary_remote_addr zone=ip_limit:10m;

    upstream ipfs_backend {
        server 127.0.0.1:14001;
    }

    server {
        listen 4001;
        proxy_pass ipfs_backend;
	    proxy_protocol on;
	    limit_conn ip_limit 10;
	    proxy_upload_rate 100k;
        proxy_download_rate 100k;
	    proxy_connect_timeout 10s;
        proxy_timeout 20m;
    }
}
