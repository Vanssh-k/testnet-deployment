events {}
stream {
  upstream ipfs_bitswap {
    least_conn;
    server ipfs_node_0:4100;
    server ipfs_node_1:4101;
    server ipfs_node_2:4102;
    server ipfs_node_3:4103;
    server ipfs_node_4:4104;
    server ipfs_node_5:4105;
    server ipfs_node_6:4106;
    server ipfs_node_7:4107;
    server ipfs_node_8:4108;
    server ipfs_node_9:4109;
  }
  
  # TCP listener for Bitswap
  server {
    listen 85;
    proxy_pass ipfs_bitswap;
  }

  # UDP listener for QUIC
  server {
    listen 85 udp;
    proxy_pass ipfs_bitswap;
  }
}
http {
  upstream ipfs_nodes {
    least_conn;
    server ipfs_node_0:5001;
    server ipfs_node_1:5001;
    server ipfs_node_2:5001;
    server ipfs_node_3:5001;
    server ipfs_node_4:5001;
    server ipfs_node_5:5001;
    server ipfs_node_6:5001;
    server ipfs_node_7:5001;
    server ipfs_node_8:5001;
    server ipfs_node_9:5001;
  }
  server {
    listen 86;
    location / {
      proxy_pass http://ipfs_nodes;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
