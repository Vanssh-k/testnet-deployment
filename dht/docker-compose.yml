version: '3'
services:
  ipfs_node_0:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    volumes:
      - ./data/ipfs_node_0:/data/ipfs
    environment:
      - PEER_ID=${PEER_ID}
      - PRIV_KEY=${PRIV_KEY}
      - IPFS_PROFILE=${IPFS_PROFILE}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - BITSWAP_PORT=4100
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
    ulimits:
      nofile:
        soft: 131072
        hard: 262144
    networks:
      - dhtNET

