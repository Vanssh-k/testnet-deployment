      - TELEGRAM_BOT_ID=${TELEGRAM_BOT_ID}
      - TELEGRAM_NOTIFICATION_GROUP_ID=${TELEGRAM_NOTIFICATION_GROUP_ID}
      - DHT_ENDPOINT=http://nginx:86/api/v0/routing/provide
    restart: unless-stopped
