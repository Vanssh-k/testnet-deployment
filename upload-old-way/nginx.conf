upstream backendd {
    server localhost:5050;
    keepalive 32;  # Enable keepalive connections to backend
  }

  resolver 8.8.8.8 valid=300s;
  keepalive_timeout 65;

  # Disk buffering paths for large requests/responses
  client_body_temp_path /tmp/nginx_client_temp 1 2;
  proxy_temp_path /tmp/nginx_proxy_temp 1 2;
  proxy_temp_file_write_size 8M;

  # DDoS protection - limit request rates
  limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

server {
    server_name node-test.lighthouse.storage;

    client_body_timeout 7200s;  # Align with backend
    client_body_buffer_size 128k;  # Small buffer for streaming
    client_max_body_size 16G;      # Allow large uploads    

    # Basic DDoS protection
    limit_conn conn_limit_per_ip 20;  # Max 20 connections per IP
    limit_req zone=req_limit_per_ip burst=20 nodelay;  # Allow bursts of 20 requests

    location /api/v0/add {
      # CORS headers
      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, encryption, Accept, Origin, X-Requested-With, X-CSRF-Token, X-User-Key, x-deal-parameter' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      # Hide any upstream CORS headers to prevent duplicates
      proxy_hide_header 'Access-Control-Allow-Origin';
      proxy_hide_header 'Access-Control-Allow-Methods';
      proxy_hide_header 'Access-Control-Allow-Headers';
      proxy_hide_header 'Access-Control-Allow-Credentials';

      # Handle OPTIONS method for CORS preflight
      if ($request_method = OPTIONS) {
        return 204;
      }

      # Proxy settings for streaming
      proxy_request_buffering off;  # Stream requests to backend
      proxy_buffering off;         # Stream responses to client
      proxy_http_version 1.1;      # Support chunked transfer
      proxy_pass http://backendd;   # Use upstream block
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "keep-alive";  # Enable keepalive
      add_header Cache-Control no-cache;

      # Buffer settings for minimal memory usage
      client_max_body_size 16G;
      client_body_buffer_size 128k;
      proxy_buffer_size 128k;
      proxy_buffers 32 128k;
      proxy_busy_buffers_size 256k;

      # Timeouts aligned with backend
      proxy_connect_timeout 7200s;
      proxy_send_timeout 7200s;
      proxy_read_timeout 7200s;
      send_timeout 7200s;

      # Retry on upstream failure
      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
      proxy_next_upstream_timeout 5;
      proxy_next_upstream_tries 3;
    }
}

